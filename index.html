<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序列圖位移與切換演示系統 - 互動展示版</title>
    <!-- 引入 Tailwind CSS 進行排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        canvas { 
            /* 確保畫布底色為全黑，拖曳超出圖片時就不會有白邊 */
            background-color: #000000; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem;
        }
        .cursor-default { cursor: default; }
        .cursor-pointer { cursor: pointer; }
        .cursor-grabbing { cursor: grabbing; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">

    <!-- 撐滿螢幕寬度 -->
    <div class="w-full flex flex-col xl:flex-row gap-8">
        
        <!-- 左側：畫布區 -->
        <div class="flex-grow flex flex-col gap-3 min-w-0">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">動畫路徑演示 (13:6 寬螢幕比例)</h1>
                    <p class="text-slate-500 text-sm mt-1">
                        👉 <span class="font-bold text-blue-600">直接拖曳畫布上的圓形節點</span> 來改變路徑！ (按住空白處拖曳可移動視角)
                    </p>
                </div>
            </div>
            <div class="w-full overflow-hidden rounded-xl bg-[#000000] border border-slate-200 flex justify-center relative">
                <!-- 內部解析度使用 1300x600 (符合 13:6 比例)，並用 CSS 強制維持比例 -->
                <canvas id="animationCanvas" width="1300" height="600" class="w-full h-auto aspect-[13/6] cursor-default"></canvas>
            </div>
        </div>

        <!-- 右側：控制面板 -->
        <div class="w-full xl:w-[360px] flex-shrink-0 bg-white p-6 rounded-xl shadow-lg border border-slate-100 flex flex-col gap-6 h-fit">
            
            <div class="border-b border-slate-100 pb-3">
                <h2 class="text-xl font-bold text-slate-800">控制面板</h2>
                <p class="text-xs text-slate-400 mt-1">可自行拖拉設定數值</p>
            </div>
            
            <div class="flex gap-3">
                <button id="playBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg shadow transition-all font-bold text-sm tracking-wide">
                    ▶ 播放/暫停
                </button>
                <button id="resetBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 px-4 rounded-lg transition-all font-bold text-sm border border-slate-200">
                    ↺ 重頭開始
                </button>
            </div>

            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-slate-700">總播放時間 (秒)</label>
                    <span id="durationDisplay" class="text-xs font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded">10 秒</span>
                </div>
                <input type="range" id="durationSlider" min="2" max="30" step="1" value="10" class="w-full h-2 bg-slate-300 rounded-lg appearance-none cursor-pointer">
            </div>

            <div class="flex flex-col gap-4">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                    畫面縮放控制
                </h3>
                
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-slate-600 font-medium">全域縮放 (含背景與路徑)</span>
                        <span id="bgZoomValue" class="text-slate-500 font-mono">1.0x</span>
                    </div>
                    <input type="range" id="bgZoomSlider" min="0.5" max="3" step="0.1" value="1" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-indigo-600 font-bold">角色序列圖專屬縮放</span>
                        <span id="seqZoomValue" class="text-indigo-600 font-mono">1.0x</span>
                    </div>
                    <input type="range" id="seqZoomSlider" min="0.2" max="3" step="0.1" value="1" class="w-full h-1.5 bg-indigo-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <div class="border-t border-slate-100 pt-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">手動更換場景背景</label>
                <div class="relative border-2 border-dashed border-slate-300 rounded-lg p-4 text-center hover:bg-slate-50 transition-colors">
                    <input type="file" id="bgImageUpload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"/>
                    <div class="text-slate-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-8 w-8 mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        <span class="text-sm font-medium">點擊或拖曳圖片至此</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // =====================================================================
        // 【開發者設定區】
        // =====================================================================
        
             // 0. 設定預設背景圖路徑
                 const DEFAULT_BG_SRC = 'map_demo.png'; // 預設背景圖片名稱

        // 1. 設定 6 組序列圖的屬性與名稱
        // 請將 src 替換成與此 HTML 檔案在同一個資料夾中的圖片檔名 (例如: 'walk_right.png')
        // cols (欄數) 與 rows (列數) 請依據你的雪碧圖(Sprite Sheet)實際格子數填寫
        const CONFIG = {
            1: { name: '起點',   src: 'right.png',      cols: 5, rows: 2, fps: 30, baseScale:0.5 },
            2: { name: '右下', src: 'right_down.png', cols: 5, rows: 2, fps: 30, baseScale:0.5  },
            3: { name: '下',   src: 'down.png',       cols: 5, rows: 2, fps: 30, baseScale:0.5 },
            4: { name: '左下', src: 'left_down.png',  cols: 5, rows: 2, fps: 30, baseScale:0.5 },
            5: { name: '左',   src: 'left.png',       cols: 5, rows: 2, fps: 30, baseScale:0.5  },
            6: { name: '終點',   src: 'left.png',       cols: 5, rows: 2, fps: 30, baseScale:0.5  } // 補足第6個方向，你可以自行更名
        };

        // 2. 預設的 6 個節點初始位置 (對應上面設定的 1~6)
        let waypoints = [
            { x: 620, y: 150, seqId: 1 }, // 節點 1: 使用 '起點' 序列圖
            { x: 1040, y: 150, seqId: 2 }, // 節點 2: 使用 '右下' 序列圖
            { x: 1160, y: 240, seqId: 3 }, // 節點 3: 使用 '下' 序列圖
            { x: 1160, y: 360, seqId: 4 }, // 節點 4: 使用 '左下' 序列圖
            { x: 1040, y: 450, seqId: 5 }, // 節點 5: 使用 '左' 序列圖
            { x: 620, y: 450, seqId: 6 }  // 節點 6: 使用 '終點' 序列圖
        ];

        // =====================================================================
        // 系統核心程式碼
        // =====================================================================

        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const bgImageUpload = document.getElementById('bgImageUpload');
        
        const durationSlider = document.getElementById('durationSlider');
        const durationDisplay = document.getElementById('durationDisplay');
        const bgZoomSlider = document.getElementById('bgZoomSlider');
        const bgZoomValue = document.getElementById('bgZoomValue');
        const seqZoomSlider = document.getElementById('seqZoomSlider');
        const seqZoomValue = document.getElementById('seqZoomValue');

        let loadedSeqImages = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
        let customBgImage = null;
        let cameraX = 0, cameraY = 0, globalZoom = 1.0, seqZoom = 1.0;
        
        let isDraggingView = false;
        let draggedWaypoint = null;
        let dragStartX = 0, dragStartY = 0;

        let isPlaying = false;
        let animationStartTime = 0;
        let currentProgress = 0;
        let totalDistance = 0;
        let animationFrameId = null;
        const nodeRadius = 8; 

        // 啟動時自動載入「預設背景圖」
        if (DEFAULT_BG_SRC) {
            const bgImg = new Image();
            bgImg.onload = () => {
                customBgImage = bgImg;
                if(!isPlaying) draw(0);
            };
            bgImg.onerror = () => {
                console.warn(`預設背景圖 (${DEFAULT_BG_SRC}) 找不到，請檢查檔名及副檔名。`);
            };
            bgImg.src = DEFAULT_BG_SRC;
        }

        // 啟動時自動載入「序列圖」
        Object.keys(CONFIG).forEach(id => {
            const img = new Image();
            img.onload = () => { loadedSeqImages[id] = img; if(!isPlaying) draw(0); };
            img.onerror = () => { console.warn(`圖片 ${CONFIG[id].src} 找不到。`); }
            img.src = CONFIG[id].src;
        });

        durationSlider.addEventListener('input', e => durationDisplay.textContent = `${e.target.value} 秒`);
        bgZoomSlider.addEventListener('input', e => { globalZoom = parseFloat(e.target.value); bgZoomValue.textContent = globalZoom.toFixed(1) + 'x'; if (!isPlaying) draw(0); });
        seqZoomSlider.addEventListener('input', e => { seqZoom = parseFloat(e.target.value); seqZoomValue.textContent = seqZoom.toFixed(1) + 'x'; if (!isPlaying) draw(0); });

        // 手動上傳背景圖的邏輯
        bgImageUpload.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => { customBgImage = img; draw(0); }
                img.src = ev.target.result;
            }
            reader.readAsDataURL(file);
        });

        function getCanvasPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (evt.clientX - rect.left) * scaleX;
            const mouseY = (evt.clientY - rect.top) * scaleY;
            return {
                x: (mouseX - cameraX) / globalZoom,
                y: (mouseY - cameraY) / globalZoom
            };
        }

        canvas.addEventListener('mousedown', evt => {
            const pos = getCanvasPos(evt);
            draggedWaypoint = waypoints.find(wp => {
                const dx = wp.x - pos.x;
                const dy = wp.y - pos.y;
                return Math.sqrt(dx*dx + dy*dy) <= nodeRadius / globalZoom + 10;
            });

            if (draggedWaypoint) {
                canvas.classList.replace('cursor-default', 'cursor-pointer');
                canvas.classList.replace('cursor-grab', 'cursor-pointer');
            } else {
                isDraggingView = true;
                dragStartX = evt.clientX - cameraX;
                dragStartY = evt.clientY - cameraY;
                canvas.classList.replace('cursor-default', 'cursor-grabbing');
                canvas.classList.replace('cursor-pointer', 'cursor-grabbing');
            }
        });

        window.addEventListener('mousemove', evt => {
            const pos = getCanvasPos(evt);

            if (draggedWaypoint) {
                draggedWaypoint.x = pos.x;
                draggedWaypoint.y = pos.y;
                calculateTotalDistance(); 
                if (!isPlaying) draw(0);
            } else if (isDraggingView) {
                cameraX = evt.clientX - dragStartX;
                cameraY = evt.clientY - dragStartY;
                if (!isPlaying) draw(0);
            } else {
                const hoverNode = waypoints.find(wp => Math.sqrt(Math.pow(wp.x - pos.x,2) + Math.pow(wp.y - pos.y,2)) <= nodeRadius / globalZoom + 10);
                if (hoverNode) {
                    canvas.classList.remove('cursor-default', 'cursor-grabbing');
                    canvas.classList.add('cursor-pointer');
                } else {
                    canvas.classList.remove('cursor-pointer', 'cursor-grabbing');
                    canvas.classList.add('cursor-default');
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isDraggingView = false;
            draggedWaypoint = null;
            canvas.classList.remove('cursor-grabbing', 'cursor-pointer');
            canvas.classList.add('cursor-default');
        });

        function calculateTotalDistance() {
            totalDistance = 0;
            for (let i = 0; i < waypoints.length - 1; i++) {
                const dx = waypoints[i+1].x - waypoints[i].x;
                const dy = waypoints[i+1].y - waypoints[i].y;
                totalDistance += Math.sqrt(dx * dx + dy * dy);
            }
        }
        calculateTotalDistance();

        function getPositionAtProgress(progress) {
            if (waypoints.length === 0) return null;
            if (progress >= 1) return { ...waypoints[waypoints.length - 1] };

            const targetDistance = progress * totalDistance;
            let acc = 0;

            for (let i = 0; i < waypoints.length - 1; i++) {
                const p1 = waypoints[i], p2 = waypoints[i+1];
                const segLen = Math.sqrt(Math.pow(p2.x - p1.x,2) + Math.pow(p2.y - p1.y,2));

                if (acc + segLen >= targetDistance) {
                    const ratio = (targetDistance - acc) / segLen;
                    return { x: p1.x + (p2.x - p1.x) * ratio, y: p1.y + (p2.y - p1.y) * ratio, seqId: p1.seqId };
                }
                acc += segLen;
            }
            return null;
        }

        function drawBackground() {
            if (customBgImage) {
                // 如果有背景圖，直接繪製背景圖
                ctx.drawImage(customBgImage, 0, 0, canvas.width, canvas.height);
            } else {
                // 如果沒有背景圖，繪製深色預設網格 (配合黑色底)
                ctx.fillStyle = '#111827'; ctx.fillRect(-5000, -5000, 10000, 10000);
                ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
                for(let x = -5000; x < 5000; x += 50) { ctx.beginPath(); ctx.moveTo(x, -5000); ctx.lineTo(x, 5000); ctx.stroke(); }
                for(let y = -5000; y < 5000; y += 50) { ctx.beginPath(); ctx.moveTo(-5000, y); ctx.lineTo(5000, y); ctx.stroke(); }
            }
        }

        function drawPath() {
            if (waypoints.length === 0) return;
            
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for (let i = 1; i < waypoints.length; i++) ctx.lineTo(waypoints[i].x, waypoints[i].y);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)';
            ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.stroke(); ctx.setLineDash([]);

            const colors = {1:'#ef4444', 2:'#f97316', 3:'#eab308', 4:'#22c55e', 5:'#3b82f6', 6:'#a855f7'};
            waypoints.forEach((wp, index) => {
                ctx.beginPath();
                ctx.arc(wp.x, wp.y, nodeRadius / globalZoom, 0, Math.PI * 2);
                ctx.fillStyle = colors[wp.seqId] || '#333';
                ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 / globalZoom; ctx.stroke();
                
                const name = CONFIG[wp.seqId].name;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                
                ctx.font = `${12/globalZoom}px sans-serif`;
                const textWidth = ctx.measureText(name).width + 12;
                ctx.fillRect(wp.x + 12/globalZoom, wp.y - 12/globalZoom, textWidth/globalZoom, 20/globalZoom);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(name, wp.x + 18/globalZoom, wp.y + 2/globalZoom);
            });
        }

        function drawSprite(x, y, seqId, timeMs) {
            ctx.save();
            ctx.translate(x, y);
            
            // 套用自訂 baseScale 與全域面板 seqZoom
            const config = CONFIG[seqId];
            const finalScale = seqZoom * (config.baseScale || 1);
            ctx.scale(finalScale, finalScale);

            const img = loadedSeqImages[seqId];
            if (img && img.width > 0) {
                const fw = img.width / config.cols, fh = img.height / config.rows;
                const totalFrames = config.cols * config.rows;
                const currentFrame = totalFrames > 1 ? Math.floor((timeMs / 1000) * config.fps) % totalFrames : 0;
                
                // 直接依原比例畫出
                let dw = fw, dh = fh;
                ctx.drawImage(img, (currentFrame % config.cols) * fw, Math.floor(currentFrame / config.cols) * fh, fw, fh, -dw/2, -dh/2, dw, dh);
            } else {
                ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('No Img', 0, 3);
            }
            ctx.restore();
        }

        function draw(timestamp = 0) {
            // 清空畫布並填滿全黑色，確保拖曳超出邊界時顯示黑色
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(cameraX, cameraY);
            ctx.scale(globalZoom, globalZoom);

            drawBackground();
            drawPath();

            if (waypoints.length > 0) {
                if (isPlaying) {
                    currentProgress = (timestamp - animationStartTime) / (parseFloat(durationSlider.value) * 1000);
                    if (currentProgress >= 1) {
                        currentProgress = 1; isPlaying = false;
                        playBtn.innerHTML = '▶ 播放動畫'; playBtn.classList.replace('bg-orange-500', 'bg-blue-600');
                    }
                }
                const pos = getPositionAtProgress(currentProgress);
                if (pos) drawSprite(pos.x, pos.y, pos.seqId, timestamp);
            }
            ctx.restore();
            if (isPlaying) animationFrameId = requestAnimationFrame(draw);
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                isPlaying = false; playBtn.innerHTML = '▶ 繼續播放'; playBtn.classList.replace('bg-orange-500', 'bg-blue-600');
                cancelAnimationFrame(animationFrameId);
            } else {
                isPlaying = true; playBtn.innerHTML = '⏸ 暫停'; playBtn.classList.replace('bg-blue-600', 'bg-orange-500');
                if (currentProgress >= 1) currentProgress = 0;
                animationStartTime = performance.now() - (currentProgress * parseFloat(durationSlider.value) * 1000);
                animationFrameId = requestAnimationFrame(draw);
            }
        });

        resetBtn.addEventListener('click', () => {
            isPlaying = false; currentProgress = 0;
            playBtn.innerHTML = '▶ 播放動畫'; if(playBtn.classList.contains('bg-orange-500')) playBtn.classList.replace('bg-orange-500', 'bg-blue-600');
            cancelAnimationFrame(animationFrameId); draw(performance.now());
        });

        draw(0);
    </script>
</body>
</html>
